<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Market &amp; Crypto Interactive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f5;
      --card: #ffffff;
      --border: #e6e6e2;
      --text: #1f2328;
      --muted: #6e7781;
      --accent: #2383e2;
      --accent-bg: #edf5ff;
      --up: #0f9d58;
      --down: #d93025;
      --grid: #f0f0ec;
    }
    [data-theme="dark"] {
      --bg: #191919;
      --surface: #222222;
      --card: #282828;
      --border: #333333;
      --text: #ebebeb;
      --muted: #9b9b9b;
      --accent: #529cca;
      --accent-bg: #1d2c3a;
      --up: #26a69a;
      --down: #ef5350;
      --grid: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 480px;
      width: 100%;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex: 0 0 auto;
    }
    .bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .spacer { flex: 1 1 auto; }
    .ctrl-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctrl-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-bg);
      font-weight: 600;
    }
    .ticker-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      overflow-x: auto;
      scrollbar-width: thin;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex: 0 0 auto;
    }
    .ticker-card {
      display: flex;
      align-items: baseline;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .ticker-card:hover { border-color: var(--accent); }
    .ticker-card.active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .t-sym { font-weight: 700; font-size: 12.5px; color: var(--text); }
    .t-price { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .t-pct { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 14px 4px 14px;
      background: var(--bg);
      flex: 0 0 auto;
    }
    .title-group {
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
    }
    .active-name { font-size: 15.5px; font-weight: 700; }
    .active-price { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .active-chg { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ohlc-info { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .range-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .chart-stage {
      flex: 1 1 auto;
      position: relative;
      width: 100%;
      min-height: 250px;
      background: var(--bg);
    }
    #chart-el { width: 100%; height: 100%; }
    .status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--bg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .status-overlay.show { opacity: 0.92; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar" id="tabs-bar"></div>
    <div class="ticker-strip" id="ticker-strip"></div>
    <div class="header-row">
      <div class="title-group">
        <span class="active-name" id="hdr-name">加载中...</span>
        <span class="active-price" id="hdr-price"></span>
        <span class="active-chg" id="hdr-chg"></span>
        <span class="ohlc-info" id="hdr-ohlc"></span>
      </div>
      <div class="range-group" id="range-bar"></div>
    </div>
    <div class="chart-stage">
      <div id="chart-el"></div>
      <div class="status-overlay show" id="status-overlay">正在加载行情数据...</div>
    </div>
  </div>

  <script>
    (function () {
      const qs = new URLSearchParams(window.location.search);
      let currentTheme = (qs.get("theme") || "light").toLowerCase() === "dark" ? "dark" : "light";
      let chartMode = "area"; // "area" | "candle"
      let activeRangeId = "1M";

      // 严格按从左到右：1D / 5D / 1M / 6M / YTD / 1Y / 5Y / ALL
      const RANGES = [
        { id: "1D",  label: "1D",  tier: "1d" },
        { id: "5D",  label: "5D",  tier: "5d" },
        { id: "1M",  label: "1M",  tier: "day", days: 22 },
        { id: "6M",  label: "6M",  tier: "day", days: 130 },
        { id: "YTD", label: "YTD", tier: "day", ytd: true },
        { id: "1Y",  label: "1Y",  tier: "day", days: 255 },
        { id: "5Y",  label: "5Y",  tier: "week", bars: 262 },
        { id: "ALL", label: "ALL", tier: "month", bars: 260 }
      ];

      function tvToTencentCandidates(rawSym) {
        const clean = rawSym.split("|")[0].trim();
        const special = {
          "FOREXCOM:SPXUSD": ["us.INX"],
          "SP:SPX": ["us.INX"],
          "FOREXCOM:NSXUSD": ["us.IXIC"],
          "NASDAQ:IXIC": ["us.IXIC"],
          "FOREXCOM:DJI": ["us.DJI"],
          "DJ:DJI": ["us.DJI"],
          "TVC:RUT": ["usIWM.N"],
          "NASDAQ:SOX": ["usSOXX.OQ"],
          "AMEX:HYG": ["usHYG.N"],
          "TVC:US10Y": ["usTLT.OQ"],
          "TVC:VIX": ["usVIXY.N"],
          "TVC:DXY": ["usUUP.N"],
          "TVC:UKOIL": ["usBNO.N"]
        };
        if (special[clean]) return special[clean];
        let exch = "", code = clean;
        if (clean.includes(":")) [exch, code] = clean.split(":");
        code = code.toUpperCase();
        if (exch === "NASDAQ") return [`us${code}.OQ`, `us${code}.N`];
        if (exch === "NYSE" || exch === "AMEX") return [`us${code}.N`, `us${code}.OQ`];
        return [`us${code}.OQ`, `us${code}.N`];
      }

      function parseList(raw) {
        if (!raw) return [];
        return raw.split(",").map(s => s.trim()).filter(Boolean).map(item => {
          let label = "", sym = item;
          if (item.includes("|")) {
            [label, sym] = item.split("|");
            label = label.trim();
            sym = sym.trim();
          } else {
            label = sym.includes(":") ? sym.split(":")[1] : sym;
          }
          return { label, sym, kind: "us", candidates: tvToTencentCandidates(sym) };
        });
      }

      const CORE_TABS = [
        {
          id: "indices",
          label: "📈 核心指数",
          items: [
            { label: "标普 500", sym: ".SPX", kind: "us", candidates: ["us.INX"] },
            { label: "纳斯达克", sym: ".IXIC", kind: "us", candidates: ["us.IXIC"] },
            { label: "道琼斯", sym: ".DJI", kind: "us", candidates: ["us.DJI"] },
            { label: "罗素 2000 (IWM)", sym: "IWM", kind: "us", candidates: ["usIWM.N"] },
            { label: "半导体 (SOXX)", sym: "SOXX", kind: "us", candidates: ["usSOXX.OQ"] },
            { label: "高收益债 (HYG)", sym: "HYG", kind: "us", candidates: ["usHYG.N"] }
          ]
        },
        {
          id: "macro",
          label: "🌍 利率与大宗",
          items: [
            { label: "伦敦金 (XAU)", sym: "XAU", kind: "okx", okx: "XAUT-USDT", cg: "tether-gold", unitPrefix: "$" },
            { label: "布伦特原油 (BNO)", sym: "BNO", kind: "us", candidates: ["usBNO.N"] },
            { label: "20Y 美债 (TLT)", sym: "TLT", kind: "us", candidates: ["usTLT.OQ"] },
            { label: "美元指数 (UUP)", sym: "UUP", kind: "us", candidates: ["usUUP.N"] },
            { label: "VIX 波动率 (VIXY)", sym: "VIXY", kind: "us", candidates: ["usVIXY.N"] }
          ]
        },
        {
          id: "crypto",
          label: "🪙 加密货币",
          items: [
            { label: "BTC", sym: "BTC", kind: "okx", okx: "BTC-USDT", cg: "bitcoin", unitPrefix: "$" },
            { label: "ETH", sym: "ETH", kind: "okx", okx: "ETH-USDT", cg: "ethereum", unitPrefix: "$" },
            { label: "BNB", sym: "BNB", kind: "okx", okx: "BNB-USDT", cg: "binancecoin", unitPrefix: "$" },
            { label: "SOL", sym: "SOL", kind: "okx", okx: "SOL-USDT", cg: "solana", unitPrefix: "$" },
            { label: "XRP", sym: "XRP", kind: "okx", okx: "XRP-USDT", cg: "ripple", unitPrefix: "$" },
            { label: "HYPE", sym: "HYPE", kind: "okx", okx: "HYPE-USDT", cg: "hyperliquid", unitPrefix: "$" }
          ]
        }
      ];

      const LAYER_DEFS = [
        { param: "l1", id: "l1", label: qs.get("l1_name") || "⚡ 能源层" },
        { param: "l2", id: "l2", label: qs.get("l2_name") || "🔌 芯片层" },
        { param: "l3", id: "l3", label: qs.get("l3_name") || "🏗️ 基础设施" },
        { param: "l4", id: "l4", label: qs.get("l4_name") || "🧠 模型层" },
        { param: "l5", id: "l5", label: qs.get("l5_name") || "🚀 应用层" }
      ];

      const tabs = [...CORE_TABS];
      let hasCustomLayers = false;
      for (const ld of LAYER_DEFS) {
        const parsed = parseList(qs.get(ld.param));
        if (parsed.length) {
          hasCustomLayers = true;
          tabs.push({ id: ld.id, label: ld.label, items: parsed });
        }
      }
      if (!hasCustomLayers) {
        const flatAi = parseList(qs.get("ai"));
        if (flatAi.length) {
          tabs.push({ id: "ai", label: qs.get("ai_name") || "🍰 AI 自选股", items: flatAi });
        } else {
          tabs.push({
            id: "demo",
            label: "🍰 AI 自选股示例",
            items: parseList("NASDAQ:CEG,NASDAQ:NVDA,NYSE:VRT,NASDAQ:MSFT,NASDAQ:PLTR")
          });
        }
      }

      let activeTabId = qs.get("tab") || tabs[0].id;
      if (!tabs.some(t => t.id === activeTabId)) activeTabId = tabs[0].id;
      let activeItemKey = "";
      const cache = new Map();
      const resolvedCode = new Map();
      let jsonpSeq = 0;

      function loadJsonp(url, cbName) {
        return new Promise((resolve) => {
          const script = document.createElement("script");
          const timer = setTimeout(() => { cleanup(); resolve(null); }, 7000);
          function cleanup() {
            clearTimeout(timer);
            try { delete window[cbName]; } catch (_) {}
            if (script.parentNode) script.parentNode.removeChild(script);
          }
          script.onload = () => {
            const payload = window[cbName];
            cleanup();
            resolve(payload || null);
          };
          script.onerror = () => { cleanup(); resolve(null); };
          script.src = url;
          document.head.appendChild(script);
        });
      }

      async function fetchUsKline(code, period, count) {
        for (const ep of ["usfqkline/get", "fqkline/get"]) {
          const cbName = `__tv_k_${++jsonpSeq}`;
          const url = `https://web.ifzq.gtimg.cn/appstock/app/${ep}?param=${encodeURIComponent(code)},${period},,,${count},qfq&_var=${cbName}`;
          const payload = await loadJsonp(url, cbName);
          try {
            const node = payload && payload.data && payload.data[code];
            const rows = (node && (node[`qfq${period}`] || node[period])) || [];
            if (rows.length) {
              const bars = rows.map(r => ({
                time: r[0],
                open: parseFloat(r[1]),
                close: parseFloat(r[2]),
                high: parseFloat(r[3]),
                low: parseFloat(r[4]),
                volume: parseFloat(r[5] || "0")
              })).filter(b => !Number.isNaN(b.close));
              if (bars.length) return bars;
            }
          } catch (_) {}
        }
        return null;
      }

      async function fetchUsIntraday(code, maxDays) {
        const cbName = `__tv_m_${++jsonpSeq}`;
        const url = `https://web.ifzq.gtimg.cn/appstock/app/dayus/query?code=${encodeURIComponent(code)}&_var=${cbName}`;
        const payload = await loadJsonp(url, cbName);
        try {
          const dayBlocks = payload && payload.data && payload.data[code] && payload.data[code].data;
          if (!Array.isArray(dayBlocks) || !dayBlocks.length) return null;
          // dayBlocks 倒序：[最新一天, 前一天, ...]
          const picked = dayBlocks.slice(0, maxDays).reverse();
          const bars = [];
          const seenTs = new Set();
          for (const db of picked) {
            const ds = String(db.date || "");
            if (ds.length !== 8) continue;
            const y = +ds.slice(0, 4), m = +ds.slice(4, 6) - 1, d = +ds.slice(6, 8);
            const pts = db.data || [];
            // 5D 时每 5 分钟采样保持丝滑，1D 保留全部 1 分钟点
            const step = maxDays > 1 ? 5 : 1;
            for (let i = 0; i < pts.length; i += step) {
              const segs = String(pts[i]).split(" ");
              if (segs.length < 2) continue;
              const hhmm = segs[0];
              const price = parseFloat(segs[1]);
              if (Number.isNaN(price) || hhmm.length < 4) continue;
              const hh = +hhmm.slice(0, 2), mm = +hhmm.slice(2, 4);
              // 以美东本地时钟编码为 UTC unix 秒用于 Lightweight Charts 横轴直观显示
              const ts = Math.floor(Date.UTC(y, m, d, hh, mm) / 1000);
              if (seenTs.has(ts)) continue;
              seenTs.add(ts);
              bars.push({
                time: ts,
                labelTime: `${ds.slice(4,6)}-${ds.slice(6,8)} ${hhmm.slice(0,2)}:${hhmm.slice(2,4)} ET`,
                open: price, high: price, low: price, close: price,
                volume: 0,
                intraday: true
              });
            }
          }
          return bars.length ? bars : null;
        } catch (_) {
          return null;
        }
      }

      async function fetchOkxBars(item, tier) {
        const barMap = {
          "1d":    { bar: "15m", limit: 96,  intraday: true },
          "5d":    { bar: "1H",  limit: 120, intraday: true },
          "day":   { bar: "1D",  limit: 300, intraday: false },
          "week":  { bar: "1W",  limit: 265, intraday: false },
          "month": { bar: "1M",  limit: 240, intraday: false }
        };
        const cfg = barMap[tier] || barMap.day;
        try {
          const r = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${encodeURIComponent(item.okx)}&bar=${cfg.bar}&limit=${cfg.limit}`);
          if (r.ok) {
            const j = await r.json();
            const rows = (j && j.data) || [];
            if (rows.length) {
              const out = [];
              const seen = new Set();
              for (const row of rows.slice().reverse()) {
                const ms = parseInt(row[0], 10);
                const d = new Date(ms);
                const timeKey = cfg.intraday ? Math.floor(ms / 1000) : d.toISOString().slice(0, 10);
                if (seen.has(timeKey)) continue;
                seen.add(timeKey);
                out.push({
                  time: timeKey,
                  labelTime: cfg.intraday
                    ? `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
                    : timeKey,
                  open: parseFloat(row[1]),
                  high: parseFloat(row[2]),
                  low: parseFloat(row[3]),
                  close: parseFloat(row[4]),
                  volume: parseFloat(row[5] || "0"),
                  intraday: cfg.intraday
                });
              }
              if (out.length) return out;
            }
          }
        } catch (_) {}

        // CoinGecko 兜底（日线级）
        if (item.cg) {
          try {
            const days = tier === "1d" ? 1 : (tier === "5d" ? 7 : 180);
            const r = await fetch(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(item.cg)}/ohlc?vs_currency=usd&days=${days}`);
            if (r.ok) {
              const rows = await r.json();
              if (Array.isArray(rows) && rows.length) {
                const isIntra = tier === "1d" || tier === "5d";
                const map = new Map();
                for (const row of rows) {
                  const d = new Date(row[0]);
                  const tk = isIntra ? Math.floor(row[0] / 1000) : d.toISOString().slice(0, 10);
                  map.set(tk, {
                    time: tk, open: row[1], high: row[2], low: row[3], close: row[4], volume: 0, intraday: isIntra
                  });
                }
                return Array.from(map.values()).sort((a, b) => (a.time > b.time ? 1 : -1));
              }
            }
          } catch (_) {}
        }
        return null;
      }

      async function getBars(item, tier) {
        const cKey = `${item.kind}:${item.sym}:${tier}`;
        if (cache.has(cKey)) return cache.get(cKey);
        let bars = null;
        if (item.kind === "okx") {
          bars = await fetchOkxBars(item, tier);
        } else {
          const itemId = `${item.kind}:${item.sym}`;
          const cands = resolvedCode.has(itemId) ? [resolvedCode.get(itemId)] : item.candidates;
          for (const cand of cands) {
            if (tier === "1d") bars = await fetchUsIntraday(cand, 1);
            else if (tier === "5d") bars = await fetchUsIntraday(cand, 5);
            else if (tier === "week") bars = await fetchUsKline(cand, "week", 265);
            else if (tier === "month") bars = await fetchUsKline(cand, "month", 260);
            else bars = await fetchUsKline(cand, "day", 265);
            if (bars && bars.length) {
              resolvedCode.set(itemId, cand);
              break;
            }
          }
        }
        if (bars) cache.set(cKey, bars);
        return bars;
      }

      function computeMA(bars, period) {
        const out = [];
        let sum = 0;
        for (let i = 0; i < bars.length; i++) {
          sum += bars[i].close;
          if (i >= period) sum -= bars[i - period].close;
          if (i >= period - 1) {
            out.push({ time: bars[i].time, value: +(sum / period).toFixed(4) });
          }
        }
        return out;
      }

      function fmtNum(v) {
        if (v == null || Number.isNaN(v)) return "--";
        if (v >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
        if (v >= 10) return v.toFixed(2);
        return v.toFixed(3);
      }

      let chart = null, mainSeries = null, ma20Series = null, volSeries = null;
      let currentBars = [];
      let currentItem = null;

      function getPalette() {
        const dark = currentTheme === "dark";
        return {
          bg: dark ? "#191919" : "#ffffff",
          text: dark ? "#c7c7c7" : "#4b5563",
          grid: dark ? "#262626" : "#f0f0ec",
          border: dark ? "#333333" : "#e6e6e2",
          up: dark ? "#26a69a" : "#0f9d58",
          down: dark ? "#ef5350" : "#d93025"
        };
      }

      function initChart(isIntraday) {
        const el = document.getElementById("chart-el");
        if (chart) { chart.remove(); chart = null; }
        const pal = getPalette();
        chart = LightweightCharts.createChart(el, {
          width: el.clientWidth,
          height: el.clientHeight,
          layout: {
            background: { type: "solid", color: pal.bg },
            textColor: pal.text,
            fontSize: 11.5
          },
          grid: { vertLines: { color: pal.grid }, horzLines: { color: pal.grid } },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { borderColor: pal.border },
          timeScale: { borderColor: pal.border, timeVisible: !!isIntraday, secondsVisible: false, rightOffset: 4 }
        });

        chart.subscribeCrosshairMove((param) => {
          if (!param || !param.time || !currentBars.length) {
            if (currentBars.length) updateHeaderStats(currentItem, currentBars, currentBars[currentBars.length - 1]);
            return;
          }
          const bar = currentBars.find(b => b.time === param.time);
          if (bar) updateHeaderStats(currentItem, currentBars, bar);
        });
      }

      function updateHeaderStats(item, bars, focusBar) {
        if (!item || !bars || !bars.length) return;
        const b = focusBar || bars[bars.length - 1];
        const refBase = (activeRangeId === "1D" || activeRangeId === "5D")
          ? bars[0].open
          : (bars.indexOf(b) > 0 ? bars[bars.indexOf(b) - 1].close : b.open);
        const pct = refBase ? ((b.close - refBase) / refBase) * 100 : 0;
        const prefix = item.unitPrefix || "";
        const freshTag = item.kind === "okx" ? "24/7 实时" : (b.intraday ? "美股分时" : "美股收盘");

        document.getElementById("hdr-name").textContent = item.label;
        document.getElementById("hdr-price").textContent = `${prefix}${fmtNum(b.close)}`;
        const chgEl = document.getElementById("hdr-chg");
        chgEl.textContent = `${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%`;
        chgEl.className = "active-chg " + (pct >= 0 ? "up" : "down");

        const tLabel = b.labelTime || String(b.time);
        document.getElementById("hdr-ohlc").textContent = b.intraday
          ? `${tLabel} · ${freshTag}`
          : `${tLabel} 开 ${fmtNum(b.open)} 高 ${fmtNum(b.high)} 低 ${fmtNum(b.low)} 收 ${fmtNum(b.close)} · ${freshTag}`;
      }

      function sliceByRange(bars, rangeCfg) {
        if (!bars || !bars.length) return [];
        if (rangeCfg.ytd) {
          const latestYear = String(bars[bars.length - 1].time).slice(0, 4);
          const ytdBars = bars.filter(b => String(b.time).startsWith(latestYear));
          return ytdBars.length >= 2 ? ytdBars : bars;
        }
        if (rangeCfg.days && bars.length > rangeCfg.days) {
          return bars.slice(bars.length - rangeCfg.days);
        }
        return bars;
      }

      function renderSeries(bars, rangeCfg) {
        const isIntraday = bars.some(b => b.intraday);
        initChart(isIntraday);
        const pal = getPalette();
        const visibleBars = sliceByRange(bars, rangeCfg);
        const useCandle = chartMode === "candle" && !(isIntraday && currentItem.kind === "us");

        if (useCandle) {
          mainSeries = chart.addCandlestickSeries({
            upColor: pal.up, downColor: pal.down,
            borderVisible: false,
            wickUpColor: pal.up, wickDownColor: pal.down
          });
          mainSeries.setData(bars.map(b => ({
            time: b.time, open: b.open, high: b.high, low: b.low, close: b.close
          })));
        } else {
          const first = visibleBars[0] || bars[0];
          const last = visibleBars[visibleBars.length - 1] || bars[bars.length - 1];
          const isUp = last.close >= first.close;
          const lc = isUp ? pal.up : pal.down;
          mainSeries = chart.addAreaSeries({
            lineColor: lc,
            topColor: isUp ? "rgba(15,157,88,0.22)" : "rgba(217,48,37,0.20)",
            bottomColor: "rgba(0,0,0,0)",
            lineWidth: 2
          });
          mainSeries.setData(bars.map(b => ({ time: b.time, value: b.close })));
        }

        if (!isIntraday && bars.length >= 20) {
          ma20Series = chart.addLineSeries({
            color: "#2962FF",
            lineWidth: 1.5,
            priceLineVisible: false,
            lastValueVisible: false
          });
          ma20Series.setData(computeMA(bars, 20));
        }

        if (!isIntraday && bars.some(b => b.volume > 0)) {
          volSeries = chart.addHistogramSeries({
            priceFormat: { type: "volume" },
            priceScaleId: "",
            lastValueVisible: false,
            priceLineVisible: false
          });
          volSeries.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
          volSeries.setData(bars.map(b => ({
            time: b.time,
            value: b.volume,
            color: b.close >= b.open ? "rgba(15,157,88,0.22)" : "rgba(217,48,37,0.22)"
          })));
        }

        if (visibleBars.length && visibleBars.length < bars.length) {
          chart.timeScale().setVisibleRange({
            from: visibleBars[0].time,
            to: visibleBars[visibleBars.length - 1].time
          });
        } else {
          chart.timeScale().fitContent();
        }
      }

      async function selectItem(item) {
        currentItem = item;
        activeItemKey = item.kind + ":" + item.sym;
        highlightTickerCards();
        const rangeCfg = RANGES.find(r => r.id === activeRangeId) || RANGES[2];
        const ov = document.getElementById("status-overlay");
        ov.textContent = `正在加载 ${item.label} (${rangeCfg.label})...`;
        ov.classList.add("show");

        const bars = await getBars(item, rangeCfg.tier);
        if (activeItemKey !== item.kind + ":" + item.sym) return;
        if (!bars || !bars.length) {
          ov.textContent = `暂未获取到 ${item.label} (${rangeCfg.label}) 数据，可切换其他时间区间`;
          return;
        }
        currentBars = bars;
        ov.classList.remove("show");
        updateHeaderStats(item, bars);
        renderSeries(bars, rangeCfg);
      }

      function highlightTickerCards() {
        document.querySelectorAll(".ticker-card").forEach(el => {
          el.classList.toggle("active", el.dataset.key === activeItemKey);
        });
      }

      function renderTickerStrip(tab) {
        const strip = document.getElementById("ticker-strip");
        strip.innerHTML = "";
        tab.items.forEach((item, idx) => {
          const key = item.kind + ":" + item.sym;
          const card = document.createElement("div");
          card.className = "ticker-card" + (idx === 0 ? " active" : "");
          card.dataset.key = key;
          card.innerHTML = `<span class="t-sym">${item.label}</span><span class="t-price">...</span><span class="t-pct"></span>`;
          card.onclick = () => selectItem(item);
          strip.appendChild(card);

          getBars(item, "day").then(bars => {
            if (!bars || !bars.length) {
              card.querySelector(".t-price").textContent = "--";
              return;
            }
            const last = bars[bars.length - 1];
            const prev = bars.length > 1 ? bars[bars.length - 2].close : last.open;
            const pct = prev ? ((last.close - prev) / prev) * 100 : 0;
            const prefix = item.unitPrefix || "";
            card.querySelector(".t-price").textContent = `${prefix}${fmtNum(last.close)}`;
            const pctEl = card.querySelector(".t-pct");
            pctEl.textContent = `${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%`;
            pctEl.className = "t-pct " + (pct >= 0 ? "up" : "down");
          });
        });
        if (tab.items.length) selectItem(tab.items[0]);
      }

      function renderRangeBar() {
        const bar = document.getElementById("range-bar");
        bar.innerHTML = "";
        for (const r of RANGES) {
          const btn = document.createElement("button");
          btn.className = "ctrl-btn" + (activeRangeId === r.id ? " active" : "");
          btn.textContent = r.label;
          btn.onclick = () => {
            activeRangeId = r.id;
            renderRangeBar();
            if (currentItem) selectItem(currentItem);
          };
          bar.appendChild(btn);
        }
        const modeBtn = document.createElement("button");
        modeBtn.className = "ctrl-btn";
        modeBtn.textContent = chartMode === "candle" ? "折线" : "K线";
        modeBtn.onclick = () => {
          chartMode = chartMode === "candle" ? "area" : "candle";
          renderRangeBar();
          if (currentBars.length) renderSeries(currentBars, RANGES.find(r => r.id === activeRangeId));
        };
        bar.appendChild(modeBtn);
      }

      function renderTabs() {
        const bar = document.getElementById("tabs-bar");
        bar.innerHTML = "";
        for (const t of tabs) {
          const btn = document.createElement("button");
          btn.className = "tab-btn" + (t.id === activeTabId ? " active" : "");
          btn.textContent = t.label;
          btn.onclick = () => {
            activeTabId = t.id;
            renderTabs();
            renderTickerStrip(t);
          };
          bar.appendChild(btn);
        }
        const spacer = document.createElement("div");
        spacer.className = "spacer";
        bar.appendChild(spacer);

        const themeBtn = document.createElement("button");
        themeBtn.className = "ctrl-btn";
        themeBtn.textContent = currentTheme === "dark" ? "☀️ 浅色" : "🌙 深色";
        themeBtn.onclick = () => {
          currentTheme = currentTheme === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", currentTheme);
          renderTabs();
          if (currentBars.length) renderSeries(currentBars, RANGES.find(r => r.id === activeRangeId));
        };
        bar.appendChild(themeBtn);
      }

      window.addEventListener("resize", () => {
        if (!chart) return;
        const el = document.getElementById("chart-el");
        chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      });

      document.documentElement.setAttribute("data-theme", currentTheme);
      renderTabs();
      renderRangeBar();
      renderTickerStrip(tabs.find(t => t.id === activeTabId));
    })();
  </script>
</body>
</html>
